<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LDE — PDF · MD · HTML</title>
  <link rel="stylesheet" href="/app.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body data-layout="mark">
  <header class="toolbar">
    <div class="brand" id="brandTitle">LDE mark</div>

    <label class="field" title="Column layout preset">
      Layout
      <select id="layoutSelect">
        <option value="mark">Mark — PDF · MD · HTML</option>
        <option value="verify-l">Verify L — MD · PDF · HTML</option>
        <option value="verify-r">Verify R — PDF · HTML · MD</option>
      </select>
    </label>

    <label class="field check" title="Keep PDF and HTML on the same book page N (page-level, not pixel scroll)">
      <input id="syncToggle" type="checkbox" />
      Sync by page
    </label>

    <span class="sep"></span>

    <label class="field">
      PDF
      <select id="pdfSelect"></select>
    </label>
    <label class="field narrow" title="Book page N = PDF file page − 1">
      Page
      <input id="pageJump" type="number" min="0" step="1" value="0" />
    </label>
    <button type="button" id="btnPrev" title="Previous PDF page (← / [ / Alt+←)">←</button>
    <button type="button" id="btnNext" title="Next PDF page (→ / ] / Alt+→)">→</button>
    <button type="button" id="btnJump">Go</button>

    <span class="sep"></span>

    <label class="field">
      MD file
      <input id="mdPath" type="text" spellcheck="false" />
    </label>
    <button type="button" id="btnLoad" title="Reload MD from disk">Load</button>
    <button type="button" id="btnSave" title="Save MD to disk">Save</button>
    <button type="button" id="btnRender" title="Re-render HTML from editor">Render HTML</button>

    <span id="status" class="status"></span>
  </header>

  <!-- Columns reordered with panes via CSS order (same preset) -->
  <div class="findbar">
    <div class="findbar-col findbar-search">
      <label class="field stack">
        Selection / search
        <input id="searchBox" type="text" spellcheck="false" placeholder="Select text in the PDF, or type a phrase…" />
      </label>
    </div>
    <div class="findbar-col findbar-actions">
      <button type="button" id="btnFindMd" title="Find next match in Markdown">Find in MD</button>
      <button type="button" id="btnFindHtml" title="Find in HTML preview">Find in HTML</button>
      <button type="button" id="btnFindNext" title="Next match in last target">Next</button>
      <button type="button" id="btnCopy" title="Copy search box to clipboard">Copy</button>
      <button type="button" id="btnInsertPage" class="primary" title="Insert []{#page-N} at MD cursor (N = current PDF page)">
        Insert page#
      </button>
      <span id="findMeta" class="muted"></span>
    </div>
    <div class="findbar-col findbar-side">
      <span id="syncMeta" class="muted"></span>
    </div>
  </div>

  <main class="panes">
    <section class="pane" id="panePdf">
      <div class="pane-head">
        <span>PDF <span class="hint">— ←→ / [] / Alt+←→ · select text → Find in MD</span></span>
        <span class="zoom-controls">
          <button type="button" id="btnZoomOut" title="PDF zoom out (Ctrl+wheel)">−</button>
          <span id="pdfZoomLabel" class="muted zoom-label">100%</span>
          <button type="button" id="btnZoomIn" title="PDF zoom in (Ctrl+wheel)">+</button>
          <button type="button" id="btnZoomReset" title="Reset PDF zoom">100%</button>
          <span id="pdfPageLabel" class="muted"></span>
        </span>
      </div>
      <div id="pdfScroll" class="pdf-scroll">
        <div id="pdfPage" class="pdf-page">
          <canvas id="pdfCanvas"></canvas>
          <div id="pdfTextLayer" class="textLayer"></div>
        </div>
      </div>
    </section>

    <section class="pane" id="paneMd">
      <div class="pane-head">
        <span>Markdown <span class="hint">— Find steps next match · Ctrl+wheel zoom</span></span>
        <span class="zoom-controls">
          <button type="button" id="btnMdZoomOut" title="MD zoom out (Ctrl+wheel)">−</button>
          <span id="mdZoomLabel" class="muted zoom-label">100%</span>
          <button type="button" id="btnMdZoomIn" title="MD zoom in (Ctrl+wheel)">+</button>
          <button type="button" id="btnMdZoomReset" title="Reset MD zoom">100%</button>
        </span>
      </div>
      <textarea id="editor" spellcheck="false" wrap="soft"></textarea>
    </section>

    <section class="pane" id="paneHtml">
      <div class="pane-head">
        <span>HTML preview <span class="hint">— #page-N · sync · Ctrl+wheel zoom</span></span>
        <span class="zoom-controls">
          <button type="button" id="btnHtmlZoomOut" title="HTML zoom out (Ctrl+wheel)">−</button>
          <span id="htmlZoomLabel" class="muted zoom-label">100%</span>
          <button type="button" id="btnHtmlZoomIn" title="HTML zoom in (Ctrl+wheel)">+</button>
          <button type="button" id="btnHtmlZoomReset" title="Reset HTML zoom">100%</button>
        </span>
      </div>
      <iframe id="htmlFrame" title="HTML preview" sandbox="allow-same-origin allow-scripts"></iframe>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
